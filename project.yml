name: Saff
options:
  bundleIdPrefix: com.ahmadmujahid
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SaffCore:
    path: Packages/SaffCore
targets:
  Saff:
    type: application
    platform: iOS
    sources:
      - Saff
      - Shared
      # Widget views + entry, so the Debug-only screenshot gallery can draw them.
      - SaffWidgets/Provider.swift
      - SaffWidgets/WidgetViews.swift
    dependencies:
      - package: SaffCore
      - target: SaffWidgets
    info:
      path: Saff/Info.plist
      properties:
        CFBundleDisplayName: Saff
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSAlarmKitUsageDescription: Saff rings an alarm before each jamaat so you don't miss it.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    entitlements:
      path: Saff/Saff.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ahmadmujahid.saff]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadmujahid.saff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SaffWidgets:
    type: app-extension
    platform: iOS
    sources: [SaffWidgets, Shared]
    dependencies:
      - package: SaffCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: SaffWidgets/Info.plist
      properties:
        CFBundleDisplayName: Saff
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    entitlements:
      path: SaffWidgets/SaffWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ahmadmujahid.saff]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadmujahid.saff.widgets
